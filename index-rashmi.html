<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f0a1f">
<title>For Rashmi ✨ 🎮</title>
<style>
:root{--p:#ff5c9a;--p2:#8b5cf6;--gold:#ffb86b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
  background:radial-gradient(circle at 15% 10%,#3b1d6e 0,transparent 55%),
             radial-gradient(circle at 85% 90%,#6e1d4b 0,transparent 55%),#0f0a1f;
  overflow:hidden;display:flex;align-items:center;justify-content:center;user-select:none}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;width:min(92vw,420px)}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;
  padding:28px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.in{animation:in .55s cubic-bezier(.2,.9,.3,1.3) both}
.out{animation:out .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-24px) scale(.96)}}
h1{font-size:1.75rem;margin-bottom:10px;line-height:1.25}
.grad{background:linear-gradient(90deg,var(--p),var(--gold),var(--p2),var(--p));background-size:300%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:300%}}
.sub{opacity:.85;margin-bottom:24px;line-height:1.6}
.emoji{font-size:3.2rem;display:inline-block;animation:bob 2s ease-in-out infinite;margin-bottom:8px}
@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
.prog{height:7px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-bottom:8px}
.bar{height:100%;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .6s ease;border-radius:9px}
.count{font-size:.8rem;opacity:.7;margin-bottom:18px;letter-spacing:.5px}
.q{font-size:1.25rem;font-weight:600;margin-bottom:22px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;color:#fff;border:0;cursor:pointer}
.opt{padding:14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  font-size:1rem;transition:transform .15s,background .2s;animation:in .5s both}
.opt:active{transform:scale(.95)}
@media(hover:hover){.opt:hover{background:rgba(255,92,154,.25)}}
.no{transition:left .25s ease,top .25s ease;background:rgba(255,255,255,.14)}
.btn{padding:14px 32px;border-radius:999px;background:linear-gradient(90deg,var(--p),var(--p2));
  font-weight:700;font-size:1.05rem;box-shadow:0 8px 24px rgba(255,92,154,.4);animation:pulse 1.8s infinite}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;animation:none;border:1px solid rgba(255,255,255,.2)}
@keyframes pulse{50%{box-shadow:0 8px 38px rgba(255,92,154,.8);transform:scale(1.03)}}
.shayari{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:1.12rem;line-height:1.75;
  min-height:220px;margin:14px 0 6px;text-align:center}
.shayari div{min-height:1.75em}
.shayari .gap{min-height:.9em}
.cur::after{content:"|";animation:blink .8s steps(1) infinite;color:var(--p)}
@keyframes blink{50%{opacity:0}}
.from{opacity:0;transition:opacity 1s;color:var(--gold);margin:8px 0 18px;font-size:.95rem}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity .8s}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);background:#fff;color:#2a1240;
  padding:12px 20px;border-radius:999px;font-weight:600;z-index:10;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);
  font-size:.9rem;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"></div>
<div class="toast" id="toast"></div>
<noscript><p style="padding:20px;text-align:center">Please enable JavaScript to see the surprise ✨</p></noscript>

<script>
// ====== EDIT THESE IF YOU WANT ======
const NAME = "Rashmi";
const FROM = "— Tumhara gaming dost 🎮";
const YES = "Haan ✅", NO = "Nahi ❌";
// dodge:true => the "Nahi" button runs away on that question
const QUESTIONS = [
  {q:"Hi Rashmi! 👋 Tumhare liye ek chhota sa game banaya hai. Khelogi?", dodge:true},
  {q:"Kya tum pro player ho? 😎"},
  {q:"Kya tumhe raat ko game khelna pasand hai? 🌙"},
  {q:"Kya tumhe chai pasand hai? 🍵"},
  {q:"Kya tumhe baarish pasand hai? 🌧️"},
  {q:"Kya tumhe pahaad pasand hain? 🏔️"},
  {q:"Kya tum game khelte waqt music sunti ho? 🎧"},
  {q:"Kya hum game mein ek achhi team hain? 🤝"},
  {q:"Kya online dost bhi sach mein ache dost ban sakte hain? 💫"},
  {q:"Last one! Ek chhota sa surprise dekhna chahogi? 🎁", dodge:true}
];
const SHAYARI = [
  "Game ki duniya mein mile the hum,",
  "bas ek naam se pehchaan hui,",
  "na chehra dekha, na awaaz suni,",
  "phir bhi pyaari si jaan-pehchaan hui. 🌙",
  "",
  "Har level jeeta, har mission kiya poora,",
  "par ek baat ab jaake samajh aayi,",
  "sabse keemti reward wo nikla,",
  "jo tumhari dosti ke roop mein aayi. ✨"
];
// ====================================

const $ = s => document.querySelector(s);
const app = $('#app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let idx = 0, answers = [], dodges = 0;

/* ---------- background: floating emojis + confetti ---------- */
const cv = $('#bg'), cx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize); resize();
const EM = ['💖','✨','💜','⭐','🎮','🌸'];
const floaters = [], confetti = [];
const newFloater = () => ({x:Math.random()*W, y:H+30, s:12+Math.random()*16, v:.35+Math.random()*.9,
  w:Math.random()*6.28, e:EM[Math.random()*EM.length|0], a:.2+Math.random()*.5});
for (let k = 0; k < 22; k++){ const f = newFloater(); f.y = Math.random()*H; floaters.push(f); }

function burst(n, x = W/2, y = H/2){
  const cols = ['#ff5c9a','#8b5cf6','#ffb86b','#5eead4','#fde047'];
  for (let k = 0; k < n; k++){
    const a = Math.random()*6.28, sp = 2 + Math.random()*7;
    confetti.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3, r:Math.random()*6.28,
      vr:(Math.random()-.5)*.3, c:cols[k%cols.length], l:80+Math.random()*50, w:5+Math.random()*5});
  }
}
function loop(){
  cx.clearRect(0, 0, W, H);
  for (const f of floaters){
    f.y -= f.v; f.w += .02;
    cx.globalAlpha = f.a; cx.font = f.s + 'px serif';
    cx.fillText(f.e, f.x + Math.sin(f.w)*20, f.y);
    if (f.y < -30) Object.assign(f, newFloater());
  }
  for (let k = confetti.length - 1; k >= 0; k--){
    const p = confetti[k];
    p.vy += .18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.l--;
    cx.globalAlpha = Math.max(0, Math.min(1, p.l/30));
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.w/4, p.w, p.w/2); cx.restore();
    if (p.l <= 0 || p.y > H + 20) confetti.splice(k, 1);
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
loop();

/* ---------- screen switching ---------- */
function show(html, after){
  document.querySelectorAll('body > .no').forEach(n => n.remove());
  const put = () => { app.innerHTML = '<div class="card in">' + html + '</div>'; if (after) after(); };
  const old = app.firstElementChild;
  if (old){ old.classList.remove('in'); old.classList.add('out'); setTimeout(put, 260); }
  else put();
}

function intro(){
  show(`<div class="emoji">🎮</div>
    <h1>Hey <span class="grad">${NAME}</span> ✨</h1>
    <p class="sub">Kisi ne tumhare liye kuch special banaya hai.<br>10 sawaal… aur phir ek surprise 🎁</p>
    <button class="btn" id="start">Start ▶</button>`,
  () => { $('#start').onclick = () => { burst(40); ask(); }; });
}

function ask(){
  const q = QUESTIONS[idx], total = QUESTIONS.length;
  const opts = `<button class="opt" data-a="${YES}" style="animation-delay:.1s">${YES}</button>`;
  const no = q.dodge
    ? `<button class="opt no" id="no" style="animation-delay:.18s">${NO}</button>`
    : `<button class="opt" data-a="${NO}" style="animation-delay:.18s">${NO}</button>`;
  show(`<div class="prog"><div class="bar" style="width:${idx/total*100}%"></div></div>
    <div class="count">Sawaal ${idx+1} / ${total}</div>
    <div class="q">${q.q}</div>
    <div class="opts">${opts}${no}</div>`,
  () => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const b = $('.bar'); if (b) b.style.width = ((idx+1)/total*100) + '%';
    }));
    document.querySelectorAll('.opt[data-a]').forEach(btn => {
      btn.onclick = e => {
        answers.push({q:q.q, a:btn.dataset.a});
        burst(22, e.clientX || W/2, e.clientY || H/2);
        if (navigator.vibrate) navigator.vibrate(15);
        idx++;
        idx < total ? ask() : finale();
      };
    });
    const n = $('#no');
    if (n){ dodges = 0; ['pointerenter','touchstart','click'].forEach(ev => n.addEventListener(ev, dodge, {passive:false})); }
  });
}

function dodge(e){
  e.preventDefault();
  const b = e.currentTarget, r = b.getBoundingClientRect();
  if (b.parentElement !== document.body){
    b.style.width = r.width + 'px';
    b.style.position = 'fixed'; b.style.zIndex = 5;
    b.style.left = r.left + 'px'; b.style.top = r.top + 'px';
    b.style.animation = 'none';
    document.body.appendChild(b);
  }
  requestAnimationFrame(() => {
    b.style.left = (10 + Math.random() * (W - r.width - 20)) + 'px';
    b.style.top  = (10 + Math.random() * (H - r.height - 20)) + 'px';
  });
  dodges++;
  if (dodges > 2) b.textContent = ['Pakad ke dikhao 😜','Nope 🙈','Haan hi daba do 😂'][dodges % 3];
}

async function finale(){
  show(`<div class="emoji">💌</div>
    <h1 class="grad">${NAME} ke liye</h1>
    <div class="shayari" id="sh"></div>
    <div class="from" id="from">${FROM}</div>
    <div class="actions" id="act">
      <button class="btn" id="copy">Copy my answers 📋</button>
      <button class="btn ghost" id="again">Play again 🔁</button>
    </div>`,
  async () => {
    burst(140); setTimeout(() => { burst(70, W*.2, H*.3); burst(70, W*.8, H*.3); }, 500);
    const sh = $('#sh');
    for (const line of SHAYARI){
      const d = document.createElement('div');
      if (!line){ d.className = 'gap'; sh.appendChild(d); await sleep(300); continue; }
      d.className = 'cur'; sh.appendChild(d);
      for (const ch of Array.from(line)){ d.textContent += ch; await sleep(42); }
      d.className = ''; await sleep(280);
    }
    burst(90);
    $('#from').style.opacity = 1;
    const act = $('#act'); act.style.opacity = 1;
    $('#copy').onclick = copyAnswers;
    $('#again').onclick = () => { idx = 0; answers = []; intro(); };
  });
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

async function copyAnswers(){
  const text = `${NAME} ke jawaab 🎮\n\n` +
    answers.map((x, k) => `${k+1}. ${x.q}\n➡ ${x.a}`).join('\n\n');
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = 0; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch {} ta.remove();
  }
  toast('Copied! Ab game chat mein paste kar do 😄');
}

intro();
</script>
</body>
</html>
